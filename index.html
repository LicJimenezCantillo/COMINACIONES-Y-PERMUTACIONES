<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Misión Matemática: Permutaciones y Combinaciones!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2250;--pink:#ff5ea8;--blue:#3b82f6;--green:#22c55e;--yellow:#facc15;--purple:#8b5cf6;--orange:#fb923c}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka','Baloo 2','Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);min-height:100vh;
  background:linear-gradient(135deg,#7dd3fc 0%,#c4b5fd 50%,#fda4af 100%);background-attachment:fixed;overflow-x:hidden;font-size:17px}
body::before,body::after{content:"";position:fixed;border-radius:50%;z-index:-1;opacity:.35;animation:drift 14s ease-in-out infinite alternate}
body::before{width:380px;height:380px;background:#fde68a;left:-120px;top:20%}
body::after{width:300px;height:300px;background:#86efac;right:-90px;bottom:8%;animation-delay:-6s}
@keyframes drift{to{transform:translate(40px,-30px) scale(1.15)}}
.hidden{display:none!important}
button{font-family:inherit}

/* HUD */
#hud{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);padding:8px 18px 10px;
  box-shadow:0 4px 14px rgba(60,30,120,.2);border-radius:0 0 24px 24px;max-width:1100px;margin:0 auto}
.hud-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.hud-level{font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px}
.chip{width:34px;height:34px;border-radius:50%;border:3px solid #c4b5fd;background:#fff;font-weight:700;color:var(--purple);cursor:pointer;font-size:.95rem}
.chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.chip.done{border-color:var(--green)}
.chip.locked{cursor:not-allowed;opacity:.55;background:#eee;border-color:#ccc}
.hud-stat{background:#f5f3ff;border-radius:999px;padding:4px 14px;font-weight:500}
.hud-stat b{font-size:1.1rem}
.bar{height:12px;background:#e9e5ff;border-radius:99px;margin-top:8px;overflow:hidden}
#barFill{height:100%;width:0;background:linear-gradient(90deg,#34d399,#facc15,#fb7185);border-radius:99px;transition:width .6s}
.hud-sub{font-size:.8rem;opacity:.7;margin-top:2px}

main{max-width:1100px;margin:0 auto;padding:18px 14px 50px}
.scene{background:#fff;border-radius:30px;padding:24px 26px 28px;box-shadow:0 10px 0 rgba(90,60,170,.18),0 20px 40px rgba(60,30,120,.18);animation:enter .5s both}
@keyframes enter{from{opacity:0;transform:translateY(20px) scale(.97)}}
.scene-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.scene h2{margin:0;font-size:1.9rem;color:var(--purple)}
.badge{background:var(--yellow);color:#6b4e00;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem}
.instr{font-size:1.15rem;line-height:1.45;margin:12px 0 4px}
.tip{font-size:.88rem;opacity:.65;margin:0 0 12px}
.body{margin:12px 0}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.fb{display:none;margin:14px auto 0;padding:14px 18px;border-radius:18px;font-size:1.08rem;line-height:1.45;max-width:820px;text-align:center}
.fb.show{display:block;animation:enter .35s both}
.fb.good{background:#dcfce7;border:3px solid #4ade80;color:#14532d}
.fb.bad{background:#fee2e2;border:3px solid #f87171;color:#7f1d1d}
.fb.hint{background:#fef9c3;border:3px solid #facc15;color:#713f12}
.pts{margin-top:6px;font-weight:700;color:#b45309}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.won{animation:won .7s}
@keyframes won{40%{transform:scale(1.025)}}

/* Botones */
.btn{font-weight:700;border:0;border-radius:999px;padding:12px 26px;font-size:1.05rem;cursor:pointer;color:#fff;
  background:linear-gradient(#34d399,#10b981);box-shadow:0 5px 0 #047857;transition:transform .08s,box-shadow .08s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #047857}
.btn.big{font-size:1.2rem;padding:14px 34px}
.btn.go{background:linear-gradient(#fb923c,#f97316);box-shadow:0 5px 0 #9a3412}
.btn.pink{background:linear-gradient(#f472b6,#ec4899);box-shadow:0 5px 0 #9d174d}
.btn.blue{background:linear-gradient(#60a5fa,#3b82f6);box-shadow:0 5px 0 #1e3a8a}
.btn.ghost{background:#fff;color:var(--purple);box-shadow:0 5px 0 #c4b5fd;border:2px solid #c4b5fd}
.btn.huge{font-size:2rem;padding:20px 54px;animation:pulse 1.6s infinite}
.btn:disabled{opacity:.5;cursor:not-allowed}
@keyframes pulse{50%{transform:scale(1.07)}}

/* Tablero */
.board{display:flex;flex-direction:column;gap:18px;align-items:center}
.pool-wrap{width:100%}
.pool-title{font-weight:600;margin:0 0 6px 8px;opacity:.75}
.zone{transition:background .15s,transform .15s,border-color .15s}
.pool{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:14px;border-radius:22px;
  background:#eef2ff;border:3px dashed #a5b4fc;min-height:110px;width:100%}
.pool:empty::before{content:attr(data-ph);opacity:.5;font-weight:600}
.slots{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;width:100%}
.slotwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot-title{font-weight:600;background:var(--purple);color:#fff;padding:4px 14px;border-radius:999px;font-size:.95rem}
.slot{min-width:136px;min-height:158px;border-radius:24px;border:4px dashed #f472b6;background:#fff7fb;display:flex;flex-wrap:wrap;
  gap:8px;align-items:center;justify-content:center;padding:8px}
.slot.multi{min-width:min(560px,86vw)}
.slot:empty::before{content:attr(data-ph);opacity:.4;font-size:1.6rem}
.zone.over{background:#fef9c3!important;border-color:#f59e0b!important;transform:scale(1.03)}
.locked .slot{border-style:solid;border-color:#4ade80;background:#f0fdf4}

.item{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;
  padding:6px 10px;border-radius:20px;background:#fff;box-shadow:0 4px 0 rgba(80,60,160,.28);transition:transform .15s}
.item:hover{transform:translateY(-3px) rotate(-1.5deg)}
.item.dragging{opacity:.25}
.locked .item{cursor:default}
.ghost-item{position:fixed;z-index:9999;pointer-events:none;transform:scale(1.12) rotate(5deg);box-shadow:0 16px 30px rgba(0,0,0,.3)!important;margin:0}
.nm{font-weight:600;font-size:1rem;text-align:center}
.av svg{display:block;overflow:visible}
.numcard{width:76px;height:96px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:700;color:#fff;
  box-shadow:inset 0 -8px 0 rgba(0,0,0,.18)}
.num1{background:#ef4444}.num2{background:#3b82f6}.num3{background:#22c55e}.num4{background:#f59e0b}
.item.cardi{padding:5px}
.tok{width:62px;height:62px;border-radius:50%;border:4px solid #fff;box-shadow:inset 0 -7px 0 rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.25)}
.item.lblitem{padding:4px}
.lbl{padding:14px 20px;border-radius:16px;font-weight:700;color:#fff;font-size:1.1rem;letter-spacing:.5px}
.lbl.perm{background:var(--purple)}.lbl.comb{background:#f97316}
.gc{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:2px;max-width:170px}
.gc .nm{width:100%;font-size:.85rem}
.gc .plus{font-weight:700;font-size:1.3rem;align-self:center}

/* códigos / extras */
.found{margin-top:14px;text-align:center}
.found h4{margin:4px 0 8px}
.codes{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:44px}
.codechip{background:#ede9fe;color:var(--purple);font-weight:700;font-size:1.4rem;padding:4px 16px;border-radius:14px;letter-spacing:4px;animation:enter .4s both}
.total{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;font-weight:500}
.total input{width:84px;font-size:1.4rem;font-family:inherit;text-align:center;border:3px solid #c4b5fd;border-radius:14px;padding:6px}
.q{text-align:center;margin-top:18px}
.qtxt{font-size:1.2rem;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.opt{font-weight:700;font-size:1.15rem;border:3px solid #c4b5fd;background:#fff;color:var(--ink);padding:12px 24px;border-radius:18px;cursor:pointer;box-shadow:0 4px 0 #c4b5fd}
.opt:hover:not(:disabled){background:#f5f3ff}
.opt:disabled{opacity:.6;cursor:default}
.opt.right{background:#bbf7d0;border-color:#22c55e;box-shadow:0 4px 0 #16a34a;opacity:1}
.opt.wrongopt{background:#fecaca;border-color:#f87171}
.swapdemo{position:relative;width:320px;height:150px;margin:14px auto 0}
.swapdemo .ring{position:absolute;left:10px;right:10px;top:0;bottom:0;border:4px dashed #34d399;border-radius:80px;background:#ecfdf5;animation:glow 2s infinite}
.swapdemo .ring span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:2px 14px;border-radius:99px;font-weight:700;font-size:.9rem}
.swapdemo .sw{position:absolute;top:14px;display:flex;flex-direction:column;align-items:center}
.swapdemo .a{left:44px;animation:swA 2.8s ease-in-out infinite}
.swapdemo .b{left:206px;animation:swB 2.8s ease-in-out infinite}
@keyframes swA{0%,15%{transform:translateX(0)}45%,70%{transform:translateX(162px)}100%{transform:translateX(0)}}
@keyframes swB{0%,15%{transform:translateX(0)}45%,70%{transform:translateX(-162px)}100%{transform:translateX(0)}}
@keyframes glow{50%{box-shadow:0 0 22px #34d399}}
.eq{text-align:center;font-weight:700;font-size:1.15rem;color:#047857;margin-top:6px}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #0003}

/* Inicio */
.start{text-align:center;padding:30px 24px 36px}
.start h1{font-size:clamp(1.9rem,5vw,3.4rem);margin:8px 0 6px;color:var(--purple);line-height:1.1;text-shadow:3px 3px 0 #fde68a}
.start h1 span{color:var(--pink)}
.hero{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;align-items:flex-end;margin:14px 0}
.hero .f{animation:float 2.6s ease-in-out infinite;text-align:center}
.hero .f:nth-child(2n){animation-delay:-1.1s}.hero .f:nth-child(3n){animation-delay:-.5s}
@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}
.hero .numcard{width:56px;height:72px;font-size:2.2rem}
.hero .tok{width:48px;height:48px}
.start p.how{font-size:1.25rem;max-width:760px;margin:12px auto 24px;line-height:1.5;background:#f5f3ff;border-radius:22px;padding:16px 22px}

/* Victoria / final */
.victory{text-align:center}
.victory h2{font-size:2.1rem}
.stars{display:flex;justify-content:center;gap:8px;margin:6px 0}
.star{font-size:4.2rem;filter:grayscale(1);opacity:.35}
.star.on{filter:none;opacity:1;animation:starpop .7s both}
@keyframes starpop{0%{transform:scale(0) rotate(-200deg)}70%{transform:scale(1.35) rotate(15deg)}100%{transform:scale(1) rotate(0)}}
.vmsg{font-size:1.3rem;font-weight:600;max-width:720px;margin:6px auto 18px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}
.stat{background:#f5f3ff;border-radius:22px;padding:14px}
.stat .v{font-size:1.9rem;font-weight:700;color:var(--purple)}
.stat .k{font-size:.95rem;opacity:.8}
.final h2{font-size:clamp(2rem,6vw,3.4rem);color:var(--pink);text-shadow:3px 3px 0 #fde68a;animation:pulse 1.6s infinite}
table.res{margin:14px auto;border-collapse:separate;border-spacing:0 8px;min-width:min(560px,100%)}
table.res th{font-size:.9rem;opacity:.7;padding:4px 14px}
table.res td{background:#f5f3ff;padding:10px 16px;font-weight:600}
table.res td:first-child{border-radius:16px 0 0 16px;text-align:left}
table.res td:last-child{border-radius:0 16px 16px 0}
table.res tr.tot td{background:#fde68a;font-weight:700}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;text-align:left;margin:16px 0}
.rule{border-radius:24px;padding:20px;color:#fff}
.rule.p{background:linear-gradient(135deg,#8b5cf6,#6366f1)}
.rule.c{background:linear-gradient(135deg,#fb923c,#f43f5e)}
.rule h3{margin:0 0 6px;font-size:1.5rem}
.rule ul{margin:8px 0 0;padding-left:20px;line-height:1.55}
.golden{background:#fef9c3;border:3px solid #facc15;border-radius:20px;padding:14px 18px;font-size:1.15rem;margin:10px 0;text-align:center}

#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%) scale(.6);background:#fff;color:var(--purple);font-weight:700;font-size:2rem;
  padding:18px 36px;border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.3);z-index:9500;opacity:0;pointer-events:none;text-align:center}
#toast.show{animation:toast 1.6s both}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
.conf{position:fixed;top:-20px;width:10px;height:15px;z-index:9000;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}

.saved{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:44px}
.svchip{position:relative;background:#ede9fe;border:3px solid #c4b5fd;border-radius:16px;padding:6px 38px 6px 14px;font-weight:600;animation:enter .35s both;display:flex;flex-direction:column;text-align:left}
.svchip.dup{background:#fee2e2;border-color:#f87171}
.svchip.try{padding-right:14px;background:#fff}
.svchip.try span{font-size:1.5rem;letter-spacing:4px;color:var(--purple)}
.svchip em{font-size:.78rem;color:#b91c1c;font-style:normal;font-weight:700}
.svchip.try em{color:#92400e}
.svchip .x{position:absolute;right:6px;top:6px;border:0;background:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;color:#b91c1c;font-weight:700}
.safe{background:linear-gradient(145deg,#64748b,#334155);border-radius:28px;padding:14px 16px 20px;border:6px solid #94a3b8;box-shadow:inset 0 0 0 4px #475569,0 8px 0 #1e293b;width:100%}
.safe-h{color:#fde68a;text-align:center;font-weight:700;font-size:1.25rem;margin-bottom:10px}
.safe .slot{background:#0f172a;border-color:#facc15;min-width:96px;min-height:130px;color:#fde68a}
.safe .slot-title{background:#facc15;color:#422006}
.safe .pool-title{color:#e2e8f0}
.safe.open{border-color:#4ade80;animation:won .8s}
.safe.open .safe-h{color:#86efac}
.safe.open .slot{border-color:#4ade80}
.num5{background:#a855f7}.num6{background:#ec4899}.num7{background:#14b8a6}.num8{background:#0ea5e9}.num9{background:#f97316}
@media(max-width:600px){
  .scene{padding:16px 14px 22px;border-radius:22px}
  .scene h2{font-size:1.45rem}
  .slot{min-width:104px;min-height:140px}
  .hud-stat{padding:3px 10px;font-size:.9rem}
}
</style>
</head>
<body>
<header id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-level"><span id="hudLevel">Nivel 1</span><div class="chips" id="chips"></div></div>
    <div class="hud-stat">⏱ Tiempo <b id="hudTime">00:00</b></div>
    <div class="hud-stat">✅ <span id="hudChLabel">Retos</span> <b id="hudCh">0/6</b></div>
    <div class="hud-stat">🎯 Intentos <b id="hudScore">0</b></div>
  </div>
  <div class="bar"><div id="barFill"></div></div>
  <div class="hud-sub">Progreso del nivel: <span id="hudPct">0%</span></div>
</header>
<main id="stage"></main>
<div id="toast"></div>

<script>
/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const fact=n=>n<=1?1:n*fact(n-1);
const Perm=(n,r)=>fact(n)/fact(n-r);          // permutaciones sin repetición
const Comb=(n,r)=>Perm(n,r)/fact(r);          // combinaciones sin repetición
const mmss=s=>{s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
const longT=s=>{s=Math.round(s);const m=Math.floor(s/60),r=s%60;const b=`${r} ${r===1?'segundo':'segundos'}`;return m?`${m} ${m===1?'minuto':'minutos'} y ${b}`:b;};
const stage=$('#stage');

/* ============ Personajes (SVG de caricatura) ============ */
const CHR={
  Ana:{skin:'#f6c9a0',hair:'#7a3b12',shirt:'#ff6fa5',style:'long'},
  Luis:{skin:'#e2a877',hair:'#222',shirt:'#3b82f6',style:'short'},
  Pedro:{skin:'#f1c27d',hair:'#b5651d',shirt:'#22c55e',style:'cap',cap:'#ef4444'},
  'María':{skin:'#c68642',hair:'#2b1b0e',shirt:'#a855f7',style:'bun'},
  Juan:{skin:'#ffd9b3',hair:'#e0a526',shirt:'#fb923c',style:'spiky'},
  'Sofía':{skin:'#8d5524',hair:'#111',shirt:'#14b8a6',style:'pony'}
};
function avatar(name,size=84){
  const c=CHR[name];let back='',front='';
  const fringe=`<path d="M23 46 Q22 12 50 12 Q78 12 77 46 Q66 28 50 30 Q34 28 23 46Z" fill="${c.hair}"/>`;
  switch(c.style){
    case 'long':back=`<path d="M20 50 Q18 14 50 14 Q82 14 80 50 L84 88 Q50 96 16 88Z" fill="${c.hair}"/>`;front=`<path d="M24 46 Q50 4 76 46 Q50 28 24 46Z" fill="${c.hair}"/>`;break;
    case 'short':front=fringe;break;
    case 'cap':front=`<path d="M22 44 Q24 8 50 8 Q76 8 78 44Z" fill="${c.cap}"/><rect x="56" y="38" width="34" height="9" rx="4.5" fill="${c.cap}"/>`;break;
    case 'bun':back=`<circle cx="50" cy="9" r="12" fill="${c.hair}"/>`;front=fringe;break;
    case 'spiky':front=`<path d="M22 46 L24 18 L35 32 L42 8 L50 30 L60 8 L66 32 L78 18 L78 46 Q64 30 50 32 Q36 30 22 46Z" fill="${c.hair}"/>`;break;
    case 'pony':back=`<circle cx="84" cy="54" r="11" fill="${c.hair}"/>`;front=fringe;break;
  }
  return `<svg width="${size}" height="${size*1.1}" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg" aria-label="${name}">
    ${back}
    <path d="M12 110 Q12 78 50 78 Q88 78 88 110Z" fill="${c.shirt}"/>
    <rect x="42" y="68" width="16" height="14" rx="6" fill="${c.skin}"/>
    <circle cx="50" cy="50" r="28" fill="${c.skin}"/>
    ${front}
    <ellipse cx="40" cy="53" rx="3.6" ry="4.6" fill="#2b2250"/><circle cx="41.3" cy="51.4" r="1.3" fill="#fff"/>
    <ellipse cx="60" cy="53" rx="3.6" ry="4.6" fill="#2b2250"/><circle cx="61.3" cy="51.4" r="1.3" fill="#fff"/>
    <circle cx="32" cy="63" r="4.5" fill="#ff8fa3" opacity=".55"/><circle cx="68" cy="63" r="4.5" fill="#ff8fa3" opacity=".55"/>
    <path d="M40 65 Q50 76 60 65" stroke="#2b2250" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}
const charItem=n=>({id:n,name:n,html:`<div class="av">${avatar(n,76)}</div><div class="nm">${n}</div>`});
const numItem=n=>({id:String(n),name:String(n),cls:'cardi',html:`<div class="numcard num${n}">${n}</div>`});
const COLORS=[{n:'Rojo',h:'#ef4444'},{n:'Azul',h:'#3b82f6'},{n:'Verde',h:'#22c55e'},{n:'Amarillo',h:'#facc15'},{n:'Morado',h:'#a855f7'}];
const colorHex=n=>COLORS.find(c=>c.n===n).h;
const colorItem=n=>({id:n,name:n,html:`<div class="tok" style="background:${colorHex(n)}"></div><div class="nm">${n}</div>`});
const groupItem=(a,b)=>({id:a+'+'+b,name:a+' y '+b,cls:'gc',html:`<div class="av">${avatar(a,46)}</div><span class="plus">+</span><div class="av">${avatar(b,46)}</div><div class="nm">${a} y ${b}</div>`});
const dots=arr=>`<span class="dots">${arr.map(n=>`<i style="background:${colorHex(n)}"></i>`).join('')}</span>`;

/* ============ Tablero con arrastrar y soltar ============ */
class Board{
  constructor(cfg){
    this.cfg=cfg;this.items={};cfg.items.forEach(i=>this.items[i.id]=i);
    this.zones=cfg.zones;this.cap={pool:Infinity};
    this.z={pool:cfg.items.map(i=>i.id)};
    cfg.zones.forEach(zn=>{this.cap[zn.id]=zn.cap||1;this.z[zn.id]=[];});
    if(cfg.init)Object.keys(cfg.init).forEach(k=>cfg.init[k].forEach(id=>{this.z.pool=this.z.pool.filter(x=>x!==id);this.z[k].push(id);}));
    this.locked=false;this.el=document.createElement('div');this.render();
  }
  mkItem(id){const it=this.items[id];const e=el('div','item '+(it.cls||''),it.html);e.dataset.id=id;e.__b=this;return e;}
  render(){
    const c=this.cfg;
    this.el.className='board'+(this.locked?' locked':'');this.el.innerHTML='';
    const pw=el('div','pool-wrap');
    if(c.poolTitle)pw.append(el('div','pool-title',c.poolTitle));
    const pool=el('div','zone pool');pool.dataset.zone='pool';pool.dataset.ph='✔ ¡Todo colocado!';pool.__b=this;
    this.z.pool.forEach(id=>pool.append(this.mkItem(id)));
    pw.append(pool);this.el.append(pw);
    const slots=el('div','slots');
    this.zones.forEach(zn=>{
      const w=el('div','slotwrap');w.append(el('div','slot-title',zn.title));
      const ze=el('div','zone slot'+(this.cap[zn.id]>1?' multi':''));
      ze.dataset.zone=zn.id;ze.dataset.ph=zn.ph||'⬇';ze.__b=this;
      this.z[zn.id].forEach(id=>ze.append(this.mkItem(id)));
      w.append(ze);slots.append(w);
    });
    this.el.append(slots);
  }
  where(id){return Object.keys(this.z).find(k=>this.z[k].includes(id));}
  move(id,to){
    if(this.locked)return false;
    const from=this.where(id);if(from===to)return false;
    if(to==='pool'){this.z[from]=this.z[from].filter(x=>x!==id);this.z.pool.push(id);}
    else{
      const cap=this.cap[to];
      if(this.z[to].length<cap){this.z[from]=this.z[from].filter(x=>x!==id);this.z[to].push(id);}
      else if(cap===1){const d=this.z[to][0];this.z[to]=[id];this.z[from]=this.z[from].filter(x=>x!==id);this.z[from].push(d);}
      else return false;
    }
    this.render();return true;
  }
  autoPlace(id){
    if(this.locked)return;
    if(this.where(id)!=='pool'){this.move(id,'pool');return;}
    const free=this.zones.find(zn=>this.z[zn.id].length<this.cap[zn.id]);
    if(free)this.move(id,free.id);
  }
  reset(){this.z.pool=this.cfg.items.map(i=>i.id);this.zones.forEach(zn=>this.z[zn.id]=[]);this.render();}
  lock(){this.locked=true;this.render();}
  placedCount(){return this.zones.reduce((a,zn)=>a+this.z[zn.id].length,0);}
  summary(){return this.zones.filter(zn=>this.z[zn.id].length).map(zn=>`<b>${zn.title}:</b> ${this.z[zn.id].map(i=>this.items[i].name).join(', ')}`).join(' · ');}
}

/* Arrastre con puntero (mouse y pantalla táctil). Un clic/toque simple coloca o devuelve la ficha. */
let D=null;
const zoneAt=(x,y)=>{const t=document.elementFromPoint(x,y);return t&&t.closest('.zone');};
document.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const it=e.target.closest('.item');
  if(!it||!it.__b||it.__b.locked)return;
  e.preventDefault();
  const r=it.getBoundingClientRect();
  D={it,b:it.__b,id:it.dataset.id,sx:e.clientX,sy:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,h:r.height,moved:false,ghost:null};
});
document.addEventListener('pointermove',e=>{
  if(!D)return;
  if(!D.moved&&Math.hypot(e.clientX-D.sx,e.clientY-D.sy)>6){
    D.moved=true;
    const g=D.it.cloneNode(true);g.classList.add('ghost-item');g.style.width=D.w+'px';
    document.body.append(g);D.ghost=g;D.it.classList.add('dragging');
  }
  if(D.moved){
    D.ghost.style.left=(e.clientX-D.dx)+'px';D.ghost.style.top=(e.clientY-D.dy)+'px';
    document.querySelectorAll('.zone.over').forEach(z=>z.classList.remove('over'));
    const z=zoneAt(e.clientX,e.clientY);
    if(z&&z.__b===D.b)z.classList.add('over');
  }
});
function endDrag(e,cancel){
  if(!D)return;const d=D;D=null;
  document.querySelectorAll('.zone.over').forEach(z=>z.classList.remove('over'));
  if(d.ghost)d.ghost.remove();
  d.it.classList.remove('dragging');
  if(cancel)return;
  if(!d.moved){d.b.autoPlace(d.id);return;}
  const z=zoneAt(e.clientX,e.clientY);
  if(z&&z.__b===d.b)d.b.move(d.id,z.dataset.zone);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* ============ Estado del juego ============ */
const LV={
  1:{name:'¡Organiza al equipo!',need:6,unit:'organizaciones',label:'Organizaciones'},
  2:{name:'¡Forma tu grupo!',need:10,unit:'parejas',label:'Parejas'},
  3:{name:'¡Descifra la clave secreta!',need:1,unit:'clave',label:'Clave'}
};
const PAR={1:240,2:300,3:300};
const STAR_TH={1:[2,6],2:[3,8],3:[8,18]};
let R={};            // resultados guardados por nivel
let L=null;          // estado del nivel actual
let timerId=null;
const unlocked=n=>n===1||!!R[n-1];

function startGame(){R={};startLevel(1);}
function startLevel(n){
  clearInterval(timerId);
  L={n,attempts:0,errors:0,correct:0,progress:0,t0:Date.now(),elapsed:0,running:true};
  $('#hud').classList.remove('hidden');
  timerId=setInterval(()=>{if(L&&L.running){L.elapsed=(Date.now()-L.t0)/1000;$('#hudTime').textContent=mmss(L.elapsed);}},250);
  updateHUD();
  LEVELS[n]();
  window.scrollTo({top:0,behavior:'smooth'});
}
function updateHUD(){
  if(!L)return;
  const info=LV[L.n];
  $('#hudLevel').textContent=`Nivel ${L.n}: ${info.name}`;
  $('#hudTime').textContent=mmss(L.elapsed);
  $('#hudChLabel').textContent=info.label;
  $('#hudCh').textContent=L.n===3?(L.progress?'¡Abierta!':'Cerrada'):`${L.progress}/${info.need}`;
  $('#hudScore').textContent=L.attempts;
  const pct=Math.round(Math.min(1,L.progress/info.need)*100);
  $('#barFill').style.width=pct+'%';$('#hudPct').textContent=pct+'%';
  const chips=$('#chips');chips.innerHTML='';
  [1,2,3].forEach(n=>{
    const b=el('button','chip'+(n===L.n?' active':'')+(R[n]?' done':'')+(!unlocked(n)?' locked':''),unlocked(n)?n:'🔒');
    b.title=unlocked(n)?`Ir al nivel ${n}`:'Completa el nivel anterior para desbloquearlo';
    b.onclick=()=>{
      if(!unlocked(n))return;
      if(n===L.n&&L.running)return;
      if(L.running&&L.progress>0&&!confirm('Si cambias de nivel, perderás el avance del nivel actual. ¿Continuar?'))return;
      startLevel(n);
    };
    chips.append(b);
  });
}
const ok=()=>{L.attempts++;L.correct++;updateHUD();};
const bad=()=>{L.attempts++;L.errors++;updateHUD();};

function scene(title,instr){
  const root=el('section','scene');
  root.innerHTML=`<div class="scene-top"><span class="badge">Nivel ${L.n}</span><h2>${title}</h2></div>
    <p class="instr"></p><p class="tip">🖱️ Arrastra las fichas con el mouse o con el dedo. También puedes hacer clic en una ficha para colocarla (o devolverla).</p>
    <div class="body"></div><div class="fb" aria-live="polite"></div><div class="actions"></div>`;
  const s={root,body:root.querySelector('.body'),fb:root.querySelector('.fb'),actions:root.querySelector('.actions'),instr:root.querySelector('.instr')};
  s.instr.innerHTML=instr;
  s.say=(t,m)=>{s.fb.className='fb show '+t;s.fb.innerHTML=m;if(t==='bad'){root.classList.remove('shake');void root.offsetWidth;root.classList.add('shake');}};
  s.btn=(label,cls,fn)=>{const b=el('button','btn '+cls,label);b.onclick=fn;s.actions.append(b);return b;};
  s.hint=text=>s.btn('💡 PISTA','ghost',()=>s.say('hint','💡 '+text));
  stage.innerHTML='';stage.append(root);
  return s;
}

/* Termina el nivel: detiene el cronómetro y guarda el resultado */
function completeLevel(s){
  L.running=false;L.elapsed=(Date.now()-L.t0)/1000;clearInterval(timerId);
  const need=LV[L.n].need;L.progress=need;
  const base=Math.max(100,300-10*L.errors);
  const bonus=Math.round(Math.max(0,1-L.elapsed/(PAR[L.n]*1.5))*100);
  const th=STAR_TH[L.n];
  const stars=L.errors<=th[0]?3:(L.errors<=th[1]?2:1);
  R[L.n]={time:L.elapsed,completed:need,attempts:L.attempts,errors:L.errors,correct:L.correct,bonus,score:base+bonus,stars};
  updateHUD();celebrate(40);
  s.root.classList.add('won');s.actions.innerHTML='';
  s.btn('🎉 ¡VER MIS RESULTADOS!','big go',()=>{L.n===3?showFinal():showVictory(L.n);});
  setTimeout(()=>s.actions.scrollIntoView({behavior:'smooth',block:'center'}),150);
}

/* ============ Animaciones ============ */
function confetti(n){
  const cols=['#ef4444','#3b82f6','#22c55e','#facc15','#a855f7','#fb923c','#ec4899'];
  for(let i=0;i<n;i++){
    const d=el('i','conf');d.style.left=Math.random()*100+'vw';d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2+Math.random()*2.2)+'s';d.style.animationDelay=(Math.random()*.6)+'s';
    d.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.append(d);setTimeout(()=>d.remove(),5200);
  }
}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}
function celebrate(n){confetti(n);toast(['¡Muy bien! 🎉','¡Correcto! ⭐','¡Genial! 🚀','¡Lo lograste! 🌟','¡Bravo! 👏'][Math.floor(Math.random()*5)]);}

/* ============ Niveles 1 y 2: guardar variantes y comprobar ============ */
function saverLevel(cfg){
  const s=scene(cfg.title,cfg.instr);
  const b=new Board(cfg.board());
  const saved=[];
  const wrap=el('div','found');
  s.body.append(b.el,wrap);
  function render(){
    wrap.innerHTML=`<h4>${cfg.listTitle}: <span>${saved.length}</span></h4><div class="saved"></div>`;
    const box=wrap.querySelector('.saved'),seen=new Set();
    saved.forEach((a,i)=>{
      const k=cfg.keyOf(a),dup=seen.has(k);seen.add(k);
      const chip=el('div','svchip'+(dup?' dup':''),`<span>${cfg.fmt(a)}</span>${dup?'<em>🔁 repetida</em>':''}`);
      const x=el('button','x','✖');x.title='Quitar';
      x.onclick=()=>{if(!L.running)return;saved.splice(i,1);render();};
      chip.append(x);box.append(chip);
    });
    L.progress=seen.size;updateHUD();
  }
  render();
  s.btn('💾 GUARDAR','blue',()=>{
    if(!L.running)return;
    const a=cfg.zoneIds.every(z=>b.z[z].length)?cfg.zoneIds.map(z=>b.z[z][0]):null;
    if(!a){s.say('hint',cfg.incomplete);return;}
    const dup=saved.some(x=>cfg.keyOf(x)===cfg.keyOf(a));
    saved.push(a);b.reset();render();
    s.say(dup?'hint':'good',dup?`Guardada, pero ojo: <b>ya tenías una igual</b> (aparece en rojo). ${cfg.dupHint}`:`¡Guardada! ✅ ${cfg.nextTip}`);
  });
  s.btn('COMPROBAR','big go',()=>{
    if(!L.running)return;
    if(!saved.length){bad();s.say('bad','Todavía no has guardado ninguna. 🤔 Arma una, pulsa <b>GUARDAR</b> y repite con otras variantes.');return;}
    const keys=saved.map(cfg.keyOf),u=new Set(keys);
    const dups=keys.length-u.size,missing=cfg.need-u.size;
    if(!dups&&!missing){ok();b.lock();s.say('good',cfg.win);completeLevel(s);return;}
    bad();
    const parts=[];
    if(dups)parts.push(`❌ Hay <b>${dups}</b> mala${dups>1?'s':''}: ${dups>1?'están repetidas':'está repetida'} (en rojo). ${cfg.dupHint} Quítala${dups>1?'s':''} con ✖.`);
    if(missing>0)parts.push(`🔍 Te faltan variantes: todavía hay <b>${missing}</b> por encontrar.`);
    if(b.placedCount()>0)parts.push('💾 Tienes fichas en los espacios que no has guardado.');
    s.say('bad',parts.join('<br>'));
  });
  s.btn('🧹 LIMPIAR','ghost',()=>{if(L.running)b.reset();});
  s.hint(cfg.hint);
}

    win:`¡Perfecto! 🎉 Tienes las <b>${Perm(3,3)} organizaciones</b> diferentes y ninguna repetida. Con 3 personajes: 3 × 2 × 1 = <b>${Perm(3,3)}</b>. Cambiar a los personajes de cargo produce una organización <b>diferente</b>: en una permutación <b>el orden importa</b>.`

/* ============ Nivel 3: la caja fuerte ============ */
function level3(){
  const SECRET=6347;
  const s=scene('¡Descifra la clave secreta!','Una caja fuerte tiene una <b>clave de cuatro cifras</b>. Arrastra <b>cuatro números</b> a las casillas para formar un número y pulsa <b>COMPROBAR</b>. El juego te dirá si el número que formaste es <b>mayor</b> o <b>menor</b> que la clave. Cambia los números y vuelve a intentarlo hasta abrir la caja.');
  const zs=[1,2,3,4].map(i=>({id:'d'+i,title:'Casilla '+i,ph:'?'}));
  const b=new Board({items:[1,2,3,4,5,6,7,8,9].map(numItem),zones:zs,poolTitle:'Tarjetas del 1 al 9'});
  const safe=el('div','safe','<div class="safe-h">🔐 CAJA FUERTE · clave de 4 cifras</div>');
  safe.append(b.el);
  const hist=el('div','found');const tries=[];
  s.body.append(safe,hist);
  function rh(){
    hist.innerHTML=`<h4>Tus intentos: <span>${tries.length}</span></h4><div class="saved">`+
      tries.slice().reverse().map(t=>`<div class="svchip try"><span>${t.n}</span><em>${t.rel==='mayor'?'⬇️ es MAYOR que la clave':'⬆️ es MENOR que la clave'}</em></div>`).join('')+'</div>';
  }
  rh();
  s.btn('COMPROBAR','big go',()=>{
    if(!L.running)return;
    if(!zs.every(z=>b.z[z.id].length)){s.say('hint','La clave tiene <b>cuatro cifras</b>: arrastra un número a cada casilla. 🔢');return;}
    const g=parseInt(zs.map(z=>b.z[z.id][0]).join(''),10);
    if(g===SECRET){
      ok();b.lock();safe.classList.add('open');
      s.say('good',`🔓 ¡Caja abierta! La clave era <b>${SECRET}</b> y la descubriste en <b>${tries.length+1}</b> intento${tries.length?'s':''}.<br>Como las tarjetas no se repiten y el orden importa, había 9 × 8 × 7 × 6 = <b>${Perm(9,4)}</b> claves posibles: ¡es una permutación!`);
      completeLevel(s);return;
    }
    bad();
    const rel=g>SECRET?'mayor':'menor';
    tries.push({n:g,rel});rh();
    s.say('bad',`Tu número <b>${g}</b> es <b>${rel}</b> que la clave. ${rel==='mayor'?'Prueba con uno más pequeño. ⬇️':'Prueba con uno más grande. ⬆️'}`);
  });
  s.btn('🧹 LIMPIAR','ghost',()=>{if(L.running)b.reset();});
  s.hint('Empieza por la primera casilla, que es la que más pesa en el número. Cámbiala y mira si el resultado pasa de "mayor" a "menor"; luego ajusta las demás.');
}

const LEVELS={1:level1,2:level2,3:level3};

/* ============ Resultados ============ */
function showVictory(n){
  const r=R[n];if(!r)return;
  const t=longT(r.time);
  const titles={1:'¡Nivel 1 completado! Ya descubriste cómo funciona una permutación',2:'¡Nivel 2 completado! Ya descubriste cómo funciona una combinación'};
  const msgs={
    3:`¡Excelente trabajo! Completaste el nivel en ${t}.`,
    2:`¡Muy buen trabajo! Completaste el nivel en ${t}. Con un poco más de práctica serás imbatible.`,
    1:`¡Lo lograste! Completaste el nivel en ${t}. Cada intento te enseñó algo; puedes volver a jugar para mejorar tu puntuación.`
  };
  stage.innerHTML=`<section class="scene victory">
    <h2>${titles[n]}</h2>
    <div class="stars">${[1,2,3].map(i=>`<span class="star ${i<=r.stars?'on':''}" style="animation-delay:${i*.35}s">⭐</span>`).join('')}</div>
    <p class="vmsg">${msgs[r.stars]}</p>
    <div class="stats">
      <div class="stat"><div class="v">⏱ ${mmss(r.time)}</div><div class="k">Tiempo total (${t})</div></div>
      <div class="stat"><div class="v">✅ ${r.completed}</div><div class="k">${LV[n].unit==='clave'?'Clave descifrada':LV[n].unit+' encontradas'}</div></div>
      <div class="stat"><div class="v">🎯 ${r.attempts}</div><div class="k">Intentos al comprobar</div></div>
      <div class="stat"><div class="v">🏅 ${r.score}</div><div class="k">Puntuación (incluye ${r.bonus} de bono por rapidez)</div></div>
    </div>
    <div class="actions">
      <button class="btn blue big" id="again">VOLVER A JUGAR</button>
      <button class="btn go big" id="next">AVANZAR AL NIVEL ${n+1}</button>
    </div></section>`;
  $('#again').onclick=()=>startLevel(n);
  $('#next').onclick=()=>{if(R[n])startLevel(n+1);};
  confetti(90);updateHUD();
}

function showFinal(){
  $('#hud').classList.add('hidden');
  const rows=[1,2,3].map(n=>R[n]);
  const totT=rows.reduce((a,r)=>a+r.time,0),totA=rows.reduce((a,r)=>a+r.attempts,0),totS=rows.reduce((a,r)=>a+r.score,0);
  const stars=Math.round(rows.reduce((a,r)=>a+r.stars,0)/3);
  stage.innerHTML=`<section class="scene victory final">
    <h2>¡MISIÓN CUMPLIDA!</h2>
    <div class="stars">${[1,2,3].map(i=>`<span class="star ${i<=stars?'on':''}" style="animation-delay:${i*.35}s">⭐</span>`).join('')}</div>
    <p class="vmsg">¡Felicitaciones! Estos fueron tus tiempos en cada nivel.</p>
    <table class="res"><thead><tr><th>Nivel</th><th>Tiempo</th><th>Intentos</th><th>Puntos</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr><td>Nivel ${i+1}: ${LV[i+1].name}</td><td>⏱ ${mmss(r.time)}</td><td>${r.attempts}</td><td>${r.score}</td></tr>`).join('')}
      <tr class="tot"><td>TOTAL</td><td>⏱ ${mmss(totT)}</td><td>${totA}</td><td>${totS}</td></tr>
    </tbody></table>
    <p class="vmsg">Tiempo total: ${longT(totT)} 🏆</p>
    <div class="golden">🔑 <b>Recuerda:</b> <b>Permutación</b> = el orden importa · <b>Combinación</b> = el orden no importa.</div>
    <div class="actions"><button class="btn go big" id="again">JUGAR OTRA VEZ</button></div>
  </section>`;
  $('#again').onclick=startGame;
  confetti(140);
}

showStart();
</script>
</body>
</html>
